<div class="col-sm-12">
        <div class="panel panel-default">
			<div class="panel-heading">Audio Recording</div>
			<div class="panel-body">

                <div class="form-group reset-flow">
                    <label class="control-label col-xs-7">Record Automatically</label>
                    <div class="col-xs-5">
                        <ui-switch ng-model='AudioRecordingEnabled' settings-change></ui-switch>
                    </div>
                </div>
            </div>

            <div class="panel-body">
                <div class="separator"></div>
                <div class ="col-sm-12" ng-show="AudioRecordingFile.length > 0">
                    <H5>Current file: {{AudioRecordingFile}}</h5>
                    <div>
                        <b>Current loudness: </b>
                        {{AudioRecordingLoundness}} dB
                    </div>
                    <div class="volume-slider-container">
                        <div class="volume-slider" ng-style="{width: loudness_percent+'%', 'background-color': loudness_color}"></div>
                    </div>
                    <div>
                        <audio controls>
                            <source src="/audiostream" type="audio/mpeg">
                            Your browser does not support the audio element.
                      </audio>
                    </div>
                </div>
                <div class="col-sm-12" ng-show="AudioRecordingFile.length == 0">
                    Not recording.
                </div>
            </div>
            <div class="panel-body">
                <div class="separator"></div>
                <div class="col-sm-12">
                    <a target="_blank" href="../audio/">Audio recordings</a>
                </div>
			</div>
		</div>
    </div>
</div>
